# Bedrock Alarm Configuration
# =============================================================================
# HOW IT WORKS:
#   Only models explicitly listed under 'models' will have alarms created.
#   No auto-discovery — you have full control over which models are monitored.
#
# HOW TO ADD A MODEL:
#   1. Find your model's TPM quota:
#      aws service-quotas list-service-quotas --service-code bedrock \
#        --region us-east-1 \
#        --query "Quotas[?contains(QuotaName,'<model name>')].{Name:QuotaName,Value:Value}"
#
#   2. Calculate EstimatedTPMQuotaUsage thresholds:
#      threshold_warning  = TPM_quota × 80%
#      threshold_critical = TPM_quota × 90%
#      Example: Claude Sonnet 4.6 TPM quota = 6,000,000
#        threshold_warning:  4800000   (6,000,000 × 80%)
#        threshold_critical: 5400000   (6,000,000 × 90%)
#
# METRIC NOTES:
#   EstimatedTPMQuotaUsage — raw token count (Sum over 60s = tokens per minute)
#   InvocationClientErrors — includes throttling 429 errors (Sum over period)
#   Invocations            — total call count (Sum over period)
#   TimeToFirstToken       — streaming APIs only, in milliseconds (Average)
#     Recommended baselines:
#       Fast models (Haiku, Nova Micro):  WARNING >2000ms, CRITICAL >4000ms
#       Mid models  (Sonnet, Nova Lite):  WARNING >3000ms, CRITICAL >5000ms
#       Large models (Opus, Nova Pro):    WARNING >5000ms, CRITICAL >8000ms
# =============================================================================

models: [] 
