# Resource-Based Alarm Configuration
# Services: EC2, Kafka (MSK), ACM, ALB, Direct Connect, EBS, EFS
# Each alarm supports optional warning/critical thresholds.
# If threshold_critical is present, two alarms are generated: -WARNING and -CRITICAL
# If only threshold (or threshold_warning) is present, one -WARNING alarm is generated.

services:
  ec2:
    name: EC2
    namespace: CWAgent
    dimension_name: InstanceId
    alarms:
      - metric: mem_used_percent
        threshold_warning: 85
        threshold_critical: 95
        operator: GreaterThanThreshold
        description: EC2实例内存使用率超过阈值 (需要CloudWatch Agent)

      - metric: disk_used_percent
        threshold_warning: 85
        threshold_critical: 95
        operator: GreaterThanThreshold
        description: EC2实例磁盘使用率超过阈值 (需要CloudWatch Agent)


  kafka:
    name: MSK (Kafka)
    namespace: AWS/Kafka
    dimension_name: Cluster Name
    alarms:
      - metric: MaxOffsetLag
        threshold_warning: 200000
        threshold_critical: 500000
        operator: GreaterThanThreshold
        description: Kafka消费者组最大偏移延迟 - 消费者落后生产者

      - metric: CpuUser
        threshold_warning: 90
        operator: GreaterThanThreshold
        description: Kafka Broker CPU用户空间使用率

      - metric: HeapMemoryAfterGC
        threshold_warning: 90
        operator: GreaterThanThreshold
        description: Kafka Broker GC后堆内存使用百分比

      - metric: KafkaDataLogsDiskUsed
        threshold_warning: 75
        threshold_critical: 86
        operator: GreaterThanThreshold
        description: Kafka数据日志磁盘使用率

      - metric: ActiveControllerCount
        threshold_critical: 1
        operator: LessThanThreshold
        description: Kafka活跃控制器数量 - 应始终为1

  acm:
    name: ACM
    namespace: AWS/CertificateManager
    dimension_name: CertificateArn
    alarms:
      - metric: DaysToExpiry
        threshold_warning: 30
        operator: LessThanOrEqualToThreshold
        description: ACM证书到期天数 - 证书即将过期

  alb:
    name: ALB
    namespace: AWS/ApplicationELB
    dimension_name: LoadBalancer
    alarms:
      - metric: UnHealthyHostCount
        threshold_warning: 1
        operator: GreaterThanOrEqualToThreshold
        description: ALB后端不健康主机数量大于等于1

  nlb:
    name: NLB
    namespace: AWS/NetworkELB
    dimension_name: LoadBalancer
    alarms:
      - metric: UnHealthyHostCount
        threshold_warning: 1
        operator: GreaterThanOrEqualToThreshold
        description: NLB后端不健康主机数量大于等于1

  directconnect:
    name: Direct Connect
    namespace: AWS/DX
    dimension_name: ConnectionId
    alarms:
      - metric: ConnectionState
        threshold_critical: 1
        operator: LessThanThreshold
        description: Direct Connect连接状态 - 连接断开

      - metric: IngressBandwidthPercent
        math_expression: "m1/bandwidth*100"
        math_metrics:
          m1: ConnectionBpsIngress
        threshold_warning: 80
        threshold_critical: 90
        operator: GreaterThanThreshold
        description: Direct Connect入站带宽使用百分比
        bandwidth_parameter: true

      - metric: EgressBandwidthPercent
        math_expression: "m1/bandwidth*100"
        math_metrics:
          m1: ConnectionBpsEgress
        threshold_warning: 80
        threshold_critical: 90
        operator: GreaterThanThreshold
        description: Direct Connect出站带宽使用百分比
        bandwidth_parameter: true

  ebs:
    name: EBS
    namespace: AWS/EBS
    dimension_name: VolumeId
    alarms:
      - metric: VolumeThroughputExceededCheck
        threshold_warning: 1
        operator: GreaterThanOrEqualToThreshold
        description: EBS卷吞吐量超过预置限制

      - metric: VolumeIOPSExceededCheck
        threshold_warning: 1
        operator: GreaterThanOrEqualToThreshold
        description: EBS卷IOPS超过预置限制

      - metric: VolumeStalledIOCheck
        threshold_warning: 1
        operator: GreaterThanOrEqualToThreshold
        description: EBS卷IO停滞检测

  efs:
    name: EFS
    namespace: AWS/EFS
    dimension_name: FileSystemId
    alarms:
      - metric: PercentIOLimit
        threshold_warning: 85
        threshold_critical: 95
        operator: GreaterThanThreshold
        description: EFS文件系统IO使用率超过阈值

  nat:
    name: NAT
    namespace: AWS/NATGateway
    dimension_name: NatGatewayId
    alarms:
      - metric: PacketsDropCount
        threshold_warning: 100
        operator: GreaterThanThreshold
        description: NAT网关连接失败丢包数量超过100

      - metric: ErrorPortAllocation
        threshold_warning: 100
        operator: GreaterThanThreshold
        description: NAT网关端口分配失败次数超过100
