AWSTemplateFormatVersion: '2010-09-09'
Description: 基于标签的CloudWatch告警 - EC2、NAT网关和VPN（WARNING + CRITICAL双级别）

Parameters:
  TagKey:
    Type: String
    Description: 用于筛选资源的标签键（例如：Environment、Team、Application）
    AllowedPattern: .+
    ConstraintDescription: TagKey为必填项，不能为空

  TagValue:
    Type: String
    Description: 用于筛选资源的标签值（例如：Production、Staging、UAT）
    AllowedPattern: .+
    ConstraintDescription: TagValue为必填项，不能为空

  SNSTopicArn:
    Type: String
    Description: 告警通知的SNS主题ARN（必填 - 未填写则告警不会发送通知）
    AllowedPattern: arn:aws:sns:[a-z0-9-]+:[0-9]{12}:.+
    ConstraintDescription: 必须是有效的SNS主题ARN（例如：arn:aws:sns:ap-southeast-2:123456789012:my-topic）

Resources:
  # =============================================================================
  # EC2 Alarms
  # =============================================================================

  # EC2: CPUUtilization WARNING (>90%)
  EC2CPUUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-CPUUtilization-WARNING"
      AlarmDescription: EC2实例CPU使用率超过90%
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(CPUUtilization) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # EC2: CPUUtilization CRITICAL (>98%)
  EC2CPUUtilizationCriticalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-CPUUtilization-CRITICAL"
      AlarmDescription: EC2实例CPU使用率超过98%
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(CPUUtilization) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 98
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # EC2: StatusCheckFailed_System CRITICAL
  EC2StatusCheckFailedSystemAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-StatusCheckFailedSystem-CRITICAL"
      AlarmDescription: EC2系统状态检查失败 - AWS基础设施问题
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(StatusCheckFailed_System) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # EC2: StatusCheckFailed_Instance CRITICAL
  EC2StatusCheckFailedInstanceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-StatusCheckFailedInstance-CRITICAL"
      AlarmDescription: EC2实例状态检查失败 - 实例配置问题
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(StatusCheckFailed_Instance) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # EC2 EBS: InstanceEBSThroughputExceededCheck WARNING
  EC2EBSThroughputExceededAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-InstanceEBSThroughputExceededCheck-WARNING"
      AlarmDescription: EC2实例EBS吞吐量超过实例最大限制（仅限Nitro实例）
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(InstanceEBSThroughputExceededCheck) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # EC2 EBS: InstanceEBSIOPSExceededCheck WARNING
  EC2EBSIOPSExceededAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-InstanceEBSIOPSExceededCheck-WARNING"
      AlarmDescription: EC2实例EBS IOPS超过实例最大限制（仅限Nitro实例）
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(InstanceEBSIOPSExceededCheck) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # =============================================================================
  # NAT Gateway Alarms
  # =============================================================================

  # NAT: ErrorPortAllocation WARNING (>100)
  NATGatewayErrorPortAllocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-NATGateway-ErrorPortAllocation-WARNING"
      AlarmDescription: NAT网关端口分配错误次数超过100
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(ErrorPortAllocation) FROM "AWS/NATGateway"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY NatGatewayId ORDER BY MAX() DESC
          Period: 300
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # NAT: PacketsDropCount WARNING (>100)
  NATGatewayPacketsDropCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-NATGateway-PacketsDropCount-WARNING"
      AlarmDescription: NAT网关连接失败丢包数量超过100
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(PacketsDropCount) FROM "AWS/NATGateway"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY NatGatewayId ORDER BY MAX() DESC
          Period: 300
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # =============================================================================
  # VPN Alarms
  # =============================================================================

  # VPN: TunnelState connection-level CRITICAL
  VPNTunnelStateConnectionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-VPN-TunnelState-Connection-CRITICAL"
      AlarmDescription: VPN连接隧道状态异常 - 连接级别监控
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(TunnelState) FROM "AWS/VPN"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY VpnId ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # VPN: TunnelState tunnel-level CRITICAL
  VPNTunnelStateTunnelAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-VPN-TunnelState-Tunnel-CRITICAL"
      AlarmDescription: VPN隧道状态异常 - 隧道级别监控
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(TunnelState) FROM "AWS/VPN"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY VpnId, TunnelIpAddress ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

Outputs:
  AlarmCount:
    Description: 此模板中的告警总数
    Value: "10"

  EC2AlarmCount:
    Description: EC2告警数量（CPU WARNING/CRITICAL、状态检查×2 CRITICAL、EBS×2 WARNING）
    Value: "6"

  NATGatewayAlarmCount:
    Description: NAT网关告警数量（ErrorPortAllocation + PacketsDropCount）
    Value: "2"

  VPNAlarmCount:
    Description: VPN告警数量（连接级别 + 隧道级别 CRITICAL）
    Value: "2"

  TagBasedServices:
    Description: 此基于标签模板监控的服务
    Value: "EC2, NAT Gateway, VPN"
