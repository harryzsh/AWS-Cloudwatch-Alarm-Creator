AWSTemplateFormatVersion: '2010-09-09'
Description: Tag-Based CloudWatch Alarms for EC2, NAT Gateway, and VPN (9 alarms)

Parameters:
  TagKey:
    Type: String
    Description: Tag key to filter resources (e.g., Environment, Team, Application)
    AllowedPattern: .+
    ConstraintDescription: TagKey is required and cannot be empty

  TagValue:
    Type: String
    Description: Tag value to filter resources (e.g., Production, Staging, UAT)
    AllowedPattern: .+
    ConstraintDescription: TagValue is required and cannot be empty

  SNSTopicArn:
    Type: String
    Description: SNS Topic ARN for alarm notifications (REQUIRED - alarms will not notify without this)
    AllowedPattern: arn:aws:sns:[a-z0-9-]+:[0-9]{12}:.+
    ConstraintDescription: Must be a valid SNS Topic ARN (e.g., arn:aws:sns:ap-southeast-2:123456789012:my-topic)

Resources:
  # =============================================================================
  # EC2 Alarms (4 alarms)
  # =============================================================================

  # EC2 Alarm 1: CPUUtilization
  EC2CPUUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-CPUUtilization_WARNING"
      AlarmDescription: EC2 CPU utilization exceeded 90%
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(CPUUtilization) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # EC2 Alarm 2: StatusCheckFailed_System
  EC2StatusCheckFailedSystemAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-StatusCheckFailedSystem_WARNING"
      AlarmDescription: EC2 system status check failed - AWS infrastructure issue
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(StatusCheckFailed_System) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # EC2 Alarm 3: StatusCheckFailed
  EC2StatusCheckFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-StatusCheckFailed_WARNING"
      AlarmDescription: EC2 status check failed - system or instance issue
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(StatusCheckFailed) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # EC2 Alarm 4: StatusCheckFailed_Instance
  EC2StatusCheckFailedInstanceAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-StatusCheckFailedInstance_WARNING"
      AlarmDescription: EC2 instance status check failed - instance configuration issue
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(StatusCheckFailed_Instance) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # =============================================================================
  # NAT Gateway Alarms (1 alarm)
  # =============================================================================

  # NAT Gateway Alarm 1: ErrorPortAllocation
  NATGatewayErrorPortAllocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-NATGateway-ErrorPortAllocation_WARNING"
      AlarmDescription: NAT Gateway port allocation errors exceeded 100
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(ErrorPortAllocation) FROM "AWS/NATGateway"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY NatGatewayId ORDER BY MAX() DESC
          Period: 300
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # =============================================================================
  # VPN Alarms (2 alarms)
  # =============================================================================

  # VPN Alarm 1: TunnelState (connection-level)
  VPNTunnelStateConnectionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-VPN-TunnelState-Connection_WARNING"
      AlarmDescription: VPN connection tunnel state abnormal - connection level monitoring
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(TunnelState) FROM "AWS/VPN"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY VpnId ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # VPN Alarm 2: TunnelState (tunnel-level)
  VPNTunnelStateTunnelAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-VPN-TunnelState-Tunnel_WARNING"
      AlarmDescription: VPN tunnel state abnormal - tunnel level monitoring
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(TunnelState) FROM "AWS/VPN"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY VpnId, TunnelIpAddress ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # =============================================================================
  # EC2 EBS Alarms (2 alarms)
  # =============================================================================

  # EC2 EBS Alarm 1: InstanceEBSThroughputExceededCheck
  EC2EBSThroughputExceededAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-InstanceEBSThroughputExceededCheck_WARNING"
      AlarmDescription: EC2 instance EBS throughput exceeded instance maximum limit (Nitro instances only)
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(InstanceEBSThroughputExceededCheck) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

  # EC2 EBS Alarm 2: InstanceEBSIOPSExceededCheck
  EC2EBSIOPSExceededAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TagValue}-EC2-InstanceEBSIOPSExceededCheck_WARNING"
      AlarmDescription: EC2 instance EBS IOPS exceeded instance maximum limit (Nitro instances only)
      Metrics:
        - Id: m1
          ReturnData: true
          Expression: !Sub >-
            SELECT MAX(InstanceEBSIOPSExceededCheck) FROM "AWS/EC2"
            WHERE tag.${TagKey} = '${TagValue}'
            GROUP BY tag.Name ORDER BY MAX() DESC
          Period: 300
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 2
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopicArn
      OKActions:
        - !Ref SNSTopicArn

Outputs:
  AlarmCount:
    Description: Total number of alarms in this template
    Value: "9"

  EC2AlarmCount:
    Description: Number of EC2 alarms (CPU, status checks x3, EBS throughput, EBS IOPS)
    Value: "6"

  NATGatewayAlarmCount:
    Description: Number of NAT Gateway alarms
    Value: "1"

  VPNAlarmCount:
    Description: Number of VPN alarms
    Value: "2"

  TagBasedServices:
    Description: Services monitored by this tag-based template
    Value: "EC2, NAT Gateway, VPN"
